plugins {
    id 'com.android.application'
}

// ── release 签名 ────────────────────────────────────────────
// 凭证放在项目根的 keystore.properties（已 gitignore，不入库）。
// 文件不存在时 release 退回 debug 签名，保证在没有密钥的机器上也能编译。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystoreProps.getProperty('storeFile') != null

android {
    namespace 'com.rd.englishcoach'
    compileSdk 35

    sourceSets {
        // 让单元测试能通过 classpath 读取 layout / drawable 源文件（布局契约测试用）
        test.resources.srcDirs += 'src/main/res'
    }

    defaultConfig {
        applicationId "com.rd.englishcoach"
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName "4.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    testOptions {
        unitTests.all {
            // 允许测试访问 sun.misc.Unsafe（用于绕过 Android Context 构造 HistoryStore）
            jvmArgs '--add-opens', 'java.base/sun.misc=ALL-UNNAMED'
            jvmArgs '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 刻意不加任何第三方运行时依赖：只用 Android 框架自带 API，
// 这样在 maven.google.com 被墙的环境下也能稳定编译。
// 单元测试仅引入 JUnit，不影响 APK 体积
dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // 离线识别运行时（v4）：ASR + VAD 共用一份。
    // 只发在 JitPack；arm64 的 .so 由 abiFilters 控制，不会把 4 种架构都打进去。
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.5'
    // 仅用于解压模型包：上游 sherpa-onnx 发的是 .tar.bz2，JDK 只有 zip/gzip，没有 bzip2。
    // 纯 Java、无 native。（AGENTS §1 规则 1 白名单）
    implementation 'org.apache.commons:commons-compress:1.27.1'
    testImplementation 'junit:junit:4.13.2'
    // 测试环境用 JVM 版 org.json（Android 框架的 org.json 在 JVM 上未实现）
    testImplementation 'org.json:json:20231013'
}
